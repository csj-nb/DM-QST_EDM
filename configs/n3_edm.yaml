# 3-qubit QST-EDM config
# Calibrated on 2026-07-31
n_qubits: 3
model_type: "edm"

# --- EDM noise schedule (3-qubit calibrated) ---
sigma_min: 0.001
sigma_max: 0.62         # Calibrated: 5x global std (0.124 * 5 ≈ 0.62)
sigma_data_diag: 0.1546  # Calibrated from 10000 random 3-qubit states
sigma_data_off: 0.1092   # Calibrated from 10000 random 3-qubit states

# --- Training noise distribution ---
P_mean: -1.2
P_std: 1.2

# --- Sampling ---
rho: 7.0
n_steps_eval: 35

# --- Model architecture ---
model:
  base_channels: 64
  dim_mults: [1, 2, 4]
  num_res_blocks: 2
  cond_dim: 128
  cond_dropout_prob: 0.1

# --- Physics-informed loss ---
# NOTE (2026-08-02): lambda_rank disabled. Penalizing (1 - purity) biases the
# model toward pure states, conflicting with the training distribution
# (60% mixed states: HS 30% + Ginibre 10% + thermal 10% + product 10%).
lambda_rank: 0.0
lambda_rank_warmup: 2000
lambda_meas: 0.0
lambda_meas_warmup: 1000

# --- Training ---
training:
  batch_size: 128
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_steps: 500
  epochs: 300
  ema_decay: 0.9999
  gradient_clip: 1.0
  save_every: 50
  val_every: 20
  log_every: 100

# --- Variable-shot training ---
use_variable_shots: true
n_shots_min: 10
n_shots_max: 50000

# --- Data ---
data:
  n_train_states: 50000
  n_val_states: 5000
  n_test_states: 5000
  n_measurement_shots: 10000
  state_types:
    pure_haar: 0.40
    mixed_hs: 0.30
    mixed_ginibre: 0.10
    thermal: 0.10
    product: 0.10
  regularization_eps: 1.0e-6
  seed: 42

# --- Evaluation ---
evaluation:
  shot_levels: [10, 20, 30, 50, 100, 300]
  n_repeats: 10
  mle_max_iter: 5000
  mle_regularization: 0.01
